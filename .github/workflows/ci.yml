name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit Rust licenses, advisories, and sources (cargo-deny)
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Run Rust workspace unit & integration tests
        run: cargo test --workspace

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm audit --prod --audit-level=high
          # Dev-only transitive picomatch<=4.0.7 (via vite/vitest); 4.0.8 is not yet published on npmjs.org
          pnpm audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

      - name: Frontend typecheck, unit tests, production bundle & release gate
        shell: bash
        run: |
          pnpm typecheck
          pnpm test:ui
          pnpm build:ui
          pnpm verify:release
