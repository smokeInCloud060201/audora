name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack and pnpm
        run: corepack enable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full quality checks and build UI
        run: |
          pnpm check
          pnpm build:ui

      - name: Build Rust release binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Verify release gate and generate SHA-256 checksums
        run: pnpm verify:release > SHA256SUMS.txt
