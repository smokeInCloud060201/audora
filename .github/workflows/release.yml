name: Release Packaging

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Native Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact_label: macos-aarch64
          - platform: ubuntu-latest
            artifact_label: linux-x86_64
          - platform: windows-latest
            artifact_label: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            dpkg-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag version synchronization, install frontend dependencies & build UI dist
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER=$(node -e 'console.log(require("fs").readFileSync("Cargo.toml","utf8").match(/\[workspace\.package\][\s\S]*?^\s*version\s*=\s*"([^"]+)"/m)[1])')
          RAW_TAG="${GITHUB_REF_NAME:-v${CARGO_VER}}"
          if [[ "${RAW_TAG}" == v* ]]; then
            TAG_VER="${RAW_TAG#v}"
            if [[ "${TAG_VER}" != "${CARGO_VER}" ]]; then
              echo "::error::Release tag v${TAG_VER} does not match Cargo.toml workspace version ${CARGO_VER}"
              exit 1
            fi
            export VITE_APP_VERSION="${TAG_VER}"
          else
            export VITE_APP_VERSION="${CARGO_VER}"
          fi
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop/ui build
          pnpm verify:release

      - name: Build release workspace binaries & run release tests
        run: |
          cargo test --workspace --release
          cargo build --workspace --release

      - name: Package OS Installers, Verify SBOM, and Generate Release Manifest
        shell: bash
        env:
          ARTIFACT_LABEL: ${{ matrix.artifact_label }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f THIRD_PARTY_NOTICES.md
          test -f sbom.cdx.json

          CARGO_VER=$(node -e 'console.log(require("fs").readFileSync("Cargo.toml","utf8").match(/\[workspace\.package\][\s\S]*?^\s*version\s*=\s*"([^"]+)"/m)[1])')
          RAW_TAG="${GITHUB_REF_NAME:-v${CARGO_VER}}"
          if [[ "${RAW_TAG}" != v* ]]; then
            RAW_TAG="v${CARGO_VER}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${GITHUB_REPOSITORY:-smokeInCloud060201/audora}"

          mkdir -p release-artifacts

          if [[ "${MATRIX_PLATFORM}" == "macos-latest" ]]; then
            APP_DIR="dist-macos/Audora.app/Contents"
            mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources/ui"
            cp target/release/audora "${APP_DIR}/MacOS/audora"
            chmod +x "${APP_DIR}/MacOS/audora"
            cp -R apps/desktop/ui/dist/* "${APP_DIR}/Resources/ui/"
            cp assets/icons/icon.png "${APP_DIR}/Resources/icon.png"

            ICONSET_DIR="dist-macos/AppIcon.iconset"
            mkdir -p "${ICONSET_DIR}"
            sips -z 16 16     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32.png" >/dev/null
            sips -z 64 64     assets/icons/icon.png --out "${ICONSET_DIR}/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512.png" >/dev/null
            sips -z 512 512   assets/icons/icon.png --out "${ICONSET_DIR}/icon_256x256@2x.png" >/dev/null
            sips -z 1024 1024 assets/icons/icon.png --out "${ICONSET_DIR}/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "${ICONSET_DIR}" -o "${APP_DIR}/Resources/AppIcon.icns"
            cp "${APP_DIR}/Resources/AppIcon.icns" "dist-macos/.VolumeIcon.icns"
            rm -rf "${ICONSET_DIR}"

            cp LICENSE THIRD_PARTY_NOTICES.md sbom.cdx.json "${APP_DIR}/Resources/"
            cp apps/desktop/src-tauri/installer/macos/uninstall-cleanup.sh "${APP_DIR}/Resources/uninstall-cleanup.sh"
            chmod +x "${APP_DIR}/Resources/uninstall-cleanup.sh"
            cat > "${APP_DIR}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Audora</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>mp4</string>
                  <string>m4v</string>
                  <string>mov</string>
                  <string>webm</string>
                  <string>mkv</string>
                  <string>mp3</string>
                  <string>wav</string>
                  <string>flac</string>
                  <string>ogg</string>
                  <string>opus</string>
                  <string>m4a</string>
                  <string>aac</string>
                </array>
                <key>CFBundleTypeName</key>
                <string>Media File</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
              </dict>
            </array>
            <key>CFBundleExecutable</key>
            <string>audora</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIconName</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.audora.desktop</string>
            <key>CFBundleName</key>
            <string>Audora</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${CLEAN_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${CLEAN_VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

            xattr -cr "dist-macos/Audora.app"
            if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              echo "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/build_cert.p12"
              security create-keychain -p "audora-ci" "${RUNNER_TEMP}/build.keychain"
              security default-keychain -s "${RUNNER_TEMP}/build.keychain"
              security unlock-keychain -p "audora-ci" "${RUNNER_TEMP}/build.keychain"
              security import "${RUNNER_TEMP}/build_cert.p12" -k "${RUNNER_TEMP}/build.keychain" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "audora-ci" "${RUNNER_TEMP}/build.keychain"
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${APP_DIR}/Resources/uninstall-cleanup.sh"
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" --entitlements apps/desktop/src-tauri/Entitlements.plist "${APP_DIR}/MacOS/audora"
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" --entitlements apps/desktop/src-tauri/Entitlements.plist "dist-macos/Audora.app"
            else
              codesign --force --sign - "${APP_DIR}/Resources/uninstall-cleanup.sh"
              codesign --force --sign - --entitlements apps/desktop/src-tauri/Entitlements.plist "${APP_DIR}/MacOS/audora"
              codesign --force --sign - --entitlements apps/desktop/src-tauri/Entitlements.plist "dist-macos/Audora.app"
            fi
            codesign --verify --deep --strict --verbose=2 "dist-macos/Audora.app"

            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              ditto -c -k --keepParent "dist-macos/Audora.app" "${RUNNER_TEMP}/Audora-notarize.zip"
              xcrun notarytool submit "${RUNNER_TEMP}/Audora-notarize.zip" --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
              xcrun stapler staple "dist-macos/Audora.app"
              rm -f "${RUNNER_TEMP}/Audora-notarize.zip"
            fi
            PRIMARY_ASSET="release-artifacts/Audora_${CLEAN_VERSION}_macos-aarch64.app.tar.gz"
            tar -czf "${PRIMARY_ASSET}" -C dist-macos Audora.app

            ln -s /Applications "dist-macos/Applications"
            cp apps/desktop/src-tauri/installer/macos/uninstall-cleanup.sh "dist-macos/Uninstall Audora.command"
            chmod +x "dist-macos/Uninstall Audora.command"
            if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "dist-macos/Uninstall Audora.command"
            fi
            if command -v SetFile >/dev/null 2>&1; then
              SetFile -a C "dist-macos" || true
            fi

            DMG_ASSET="release-artifacts/Audora_${CLEAN_VERSION}_macos-aarch64.dmg"
            hdiutil create -volname "Audora" -srcfolder dist-macos -ov -format UDZO "${DMG_ASSET}"
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
              codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp "${DMG_ASSET}"
              xcrun notarytool submit "${DMG_ASSET}" --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
              xcrun stapler staple "${DMG_ASSET}"
            fi

          elif [[ "${MATRIX_PLATFORM}" == "ubuntu-latest" ]]; then
            DEB_ROOT="dist-linux/audora-deb"
            mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/usr/share/audora/ui" "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps" "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps" "${DEB_ROOT}/usr/share/applications"
            cp target/release/audora "${DEB_ROOT}/usr/bin/audora"
            chmod 0755 "${DEB_ROOT}/usr/bin/audora"
            cp -R apps/desktop/ui/dist/* "${DEB_ROOT}/usr/share/audora/ui/"
            cp LICENSE THIRD_PARTY_NOTICES.md sbom.cdx.json "${DEB_ROOT}/usr/share/audora/"
            cp assets/icons/32x32.png "${DEB_ROOT}/usr/share/icons/hicolor/32x32/apps/audora.png"
            cp assets/icons/icon.png "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps/audora.png"
            cat > "${DEB_ROOT}/usr/share/applications/audora.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Audora
          Comment=Local-first audio and video player with timestamped notes
          Exec=/usr/bin/audora %F
          Icon=audora
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;Video;Audio;
          MimeType=video/mp4;video/x-m4v;video/webm;video/quicktime;video/x-matroska;audio/wav;audio/x-wav;audio/flac;audio/x-flac;audio/ogg;audio/opus;audio/x-opus+ogg;audio/mpeg;audio/mp4;audio/x-m4a;audio/aac;
          DESKTOP
            cat > "${DEB_ROOT}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          case "$1" in
            configure)
              if command -v update-desktop-database >/dev/null 2>&1; then
                update-desktop-database -q /usr/share/applications || true
              fi
              if command -v gtk-update-icon-cache >/dev/null 2>&1; then
                gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
              fi
              ;;
          esac
          exit 0
          POSTINST
            chmod 0755 "${DEB_ROOT}/DEBIAN/postinst"
            cp apps/desktop/src-tauri/installer/linux/postrm "${DEB_ROOT}/DEBIAN/postrm"
            chmod 0755 "${DEB_ROOT}/DEBIAN/postrm"
            cat > "${DEB_ROOT}/DEBIAN/control" <<CONTROL
          Package: audora
          Version: ${CLEAN_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, xdg-utils
          Recommends: zenity | kdialog, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good
          Maintainer: Audora Contributors
          Description: Local-first desktop audio and video player with timestamped notes
          CONTROL
            PRIMARY_ASSET="release-artifacts/Audora_${CLEAN_VERSION}_linux-x86_64.deb"
            dpkg-deb --build "${DEB_ROOT}" "${PRIMARY_ASSET}"
            tar -czf "release-artifacts/Audora_${CLEAN_VERSION}_linux-x86_64.tar.gz" -C "${DEB_ROOT}/usr" bin share

          else
            WIN_STAGE="dist-windows/Audora"
            mkdir -p "${WIN_STAGE}/ui"
            if [[ -n "${WINDOWS_CERTIFICATE:-}" ]]; then
              echo "${WINDOWS_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/win_cert.pfx"
              signtool.exe sign /f "${RUNNER_TEMP}/win_cert.pfx" /p "${WINDOWS_CERTIFICATE_PASSWORD:-}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/audora.exe
            fi
            cp target/release/audora.exe "${WIN_STAGE}/Audora.exe"
            cp assets/icons/icon.ico "${WIN_STAGE}/Audora.ico"
            cp -R apps/desktop/ui/dist/* "${WIN_STAGE}/ui/"
            cp LICENSE THIRD_PARTY_NOTICES.md sbom.cdx.json "${WIN_STAGE}/"
            PORTABLE_ZIP="release-artifacts/Audora_${CLEAN_VERSION}_windows-x86_64-portable.zip"
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist-windows/Audora/*' -DestinationPath '${PORTABLE_ZIP}' -Force"

            if command -v makensis >/dev/null 2>&1 || [[ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
              MAKENSIS_BIN=$(command -v makensis || echo "/c/Program Files (x86)/NSIS/makensis.exe")
              SETUP_EXE="release-artifacts/Audora_${CLEAN_VERSION}_windows-x86_64-setup.exe"
              cat > dist-windows/audora-installer.nsi <<NSIS
          !include "MUI2.nsh"
          !define MUI_ICON "../assets/icons/icon.ico"
          !define MUI_UNICON "../assets/icons/icon.ico"
          !include "../apps/desktop/src-tauri/installer/windows/nsis-hooks.nsh"
          Name "Audora ${CLEAN_VERSION}"
          OutFile "../${SETUP_EXE}"
          InstallDir "\$LOCALAPPDATA\\Programs\\Audora"
          InstallDirRegKey HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "InstallLocation"
          RequestExecutionLevel user
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            nsExec::ExecToLog 'taskkill /F /IM Audora.exe'
            nsExec::ExecToLog 'taskkill /F /IM audora.exe'
            Sleep 400
            SetOutPath "\$INSTDIR"
            File /r "Audora\\*.*"
            WriteUninstaller "\$INSTDIR\\Uninstall.exe"
            CreateDirectory "\$SMPROGRAMS\\Audora"
            CreateShortCut "\$SMPROGRAMS\\Audora\\Audora.lnk" "\$INSTDIR\\Audora.exe" "" "\$INSTDIR\\Audora.ico" 0
            CreateShortCut "\$DESKTOP\\Audora.lnk" "\$INSTDIR\\Audora.exe" "" "\$INSTDIR\\Audora.ico" 0
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "DisplayName" "Audora"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "DisplayVersion" "${CLEAN_VERSION}"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "DisplayIcon" '"\$INSTDIR\\Audora.ico"'
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "InstallLocation" "\$INSTDIR"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "Publisher" "Audora Contributors"
            WriteRegStr HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora" "UninstallString" '"\$INSTDIR\\Uninstall.exe"'
          SectionEnd

          Section "Uninstall"
            !insertmacro NSIS_HOOK_PREUNINSTALL
            Delete "\$SMPROGRAMS\\Audora\\Audora.lnk"
            RMDir "\$SMPROGRAMS\\Audora"
            Delete "\$DESKTOP\\Audora.lnk"
            ; Remove only Audora's installed files & owned subdirectories — NEVER RMDir /r \$INSTDIR (`H-1`)
            RMDir /r "\$INSTDIR\\ui"
            Delete "\$INSTDIR\\Audora.exe"
            Delete "\$INSTDIR\\Audora.ico"
            Delete "\$INSTDIR\\LICENSE"
            Delete "\$INSTDIR\\THIRD_PARTY_NOTICES.md"
            Delete "\$INSTDIR\\sbom.cdx.json"
            Delete "\$INSTDIR\\Uninstall.exe"
            RMDir "\$INSTDIR"
            DeleteRegKey HKCU "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Audora"
          SectionEnd
          NSIS
              (cd dist-windows && "${MAKENSIS_BIN}" audora-installer.nsi)
              if [[ -n "${WINDOWS_CERTIFICATE:-}" ]]; then
                signtool.exe sign /f "${RUNNER_TEMP}/win_cert.pfx" /p "${WINDOWS_CERTIFICATE_PASSWORD:-}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${SETUP_EXE}"
              fi
              PRIMARY_ASSET="${SETUP_EXE}"
            else
              PRIMARY_ASSET="${PORTABLE_ZIP}"
            fi
          fi

          ASSET_BASENAME=$(basename "${PRIMARY_ASSET}")
          ASSET_SIZE=$(wc -c < "${PRIMARY_ASSET}" | tr -d '[:space:]')
          if command -v sha256sum >/dev/null 2>&1; then
            ASSET_SHA256=$(sha256sum "${PRIMARY_ASSET}" | awk '{print $1}')
          else
            ASSET_SHA256=$(shasum -a 256 "${PRIMARY_ASSET}" | awk '{print $1}')
          fi

          cat > "release-artifacts/release-manifest-${ARTIFACT_LABEL}.json" <<EOF
          {
            "version": "${CLEAN_VERSION}",
            "title": "Audora ${CLEAN_VERSION} is ready",
            "notes": "Verified GitHub Release build for ${ARTIFACT_LABEL}.",
            "package_size_bytes": ${ASSET_SIZE},
            "sha256": "${ASSET_SHA256}",
            "published_at": "${PUBLISHED_AT}",
            "download_url": "https://github.com/${REPO_SLUG}/releases/download/${RAW_TAG}/${ASSET_BASENAME}"
          }
          EOF

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum LICENSE THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "${RUNNER_TEMP}/release-manifests-${ARTIFACT_LABEL}.sha256"
          else
            shasum -a 256 LICENSE THIRD_PARTY_NOTICES.md sbom.cdx.json release-artifacts/* > "${RUNNER_TEMP}/release-manifests-${ARTIFACT_LABEL}.sha256"
          fi
          mv "${RUNNER_TEMP}/release-manifests-${ARTIFACT_LABEL}.sha256" "release-artifacts/release-manifests-${ARTIFACT_LABEL}.sha256"

      - name: Attest Cryptographic Build Provenance (GitHub Sigstore SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-artifacts/*"

      - name: Upload Installer Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: audora-${{ matrix.artifact_label }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: audora-*
          path: release-bundle
          merge-multiple: true

      - name: Publish Installers Atomically to GitHub Release Tag
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
