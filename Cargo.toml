[workspace]
resolver = "2"
members = [
    "crates/audora-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.1.2"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Audora Contributors"]
repository = "https://github.com/smokeInCloud060201/audora"

[workspace.dependencies]
audora-core = { version = "1.1.2", path = "crates/audora-core" }
getrandom = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tao = "0.37"
tempfile = "3.13"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wry = "0.57"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
