# cargo-deny configuration for Audora (Apache-2.0 project policy)
# Enforces ADR 0002: permissive and weak-copyleft file-scoped crates only; no GPL/AGPL/SSPL.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive unmaintained macro crate in frozen upstream Linux `gtk3-rs` (`gtk 0.18` <- `tao`/`wry`); no upstream upgrade exists.
    { id = "RUSTSEC-2024-0370", reason = "Transitive proc-macro-error 1.0.4 via Linux gtk 0.18 (tao/wry); no safe upstream upgrade exists" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
