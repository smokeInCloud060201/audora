[package]
name = "audora-core"
version = "0.1.0"
description = "Audora cross-platform local media player and timestamped notes core"
authors = ["Audora Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "audora_core"
path = "src/lib.rs"

[[bin]]
name = "audora"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.13"
